name: Tests
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        rails: ['~> 8.1.4']
        json: ['~> 2.0', '~> 3.0']
    env:
      GRAPE_VERSION: '~> 3.1.0'
      GRAPE_SWAGGER_VERSION: '2.1.4'
      RAILS_VERSION: ${{ matrix.rails }}
      JSON_VERSION: ${{ matrix.json }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Print Bundler Versions
        run: bundle show
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "130.0"
      - uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: "0.35.0"
      - name: Run tests with Sprockets
        uses: coactions/setup-xvfb@v1
        env:
          ASSET_PIPELINE: sprockets
        with:
          run: bundle exec rake spec
      - name: Run tests with Propshaft
        uses: coactions/setup-xvfb@v1
        env:
          ASSET_PIPELINE: propshaft
        with:
          run: bundle exec rake spec
