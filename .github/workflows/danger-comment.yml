name: Danger Comment
on:
  workflow_run:
    workflows: ['Danger']
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    uses: numbata/danger-pr-comment/.github/workflows/danger-comment.yml@v0.2.0
