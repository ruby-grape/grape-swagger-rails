name: Swagger UI Update

"on":
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check latest Swagger UI release
        id: swagger-ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_version="$(ruby -r ./lib/grape-swagger-rails/version -e 'print GrapeSwaggerRails::SWAGGER_UI_VERSION')"
          latest_tag="$(gh api repos/swagger-api/swagger-ui/releases/latest --jq .tag_name)"
          latest_version="${latest_tag#v}"

          echo "current-version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "latest-tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "latest-version=${latest_version}" >> "$GITHUB_OUTPUT"

          if [ "$current_version" != "$latest_version" ]; then
            echo "update-needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "update-needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Swagger UI assets
        if: steps.swagger-ui.outputs.update-needed == 'true'
        env:
          SWAGGER_UI_VERSION: ${{ steps.swagger-ui.outputs.latest-tag }}
        run: bundle exec rake swagger_ui:dist:update

      - name: Create pull request
        id: pull-request
        if: steps.swagger-ui.outputs.update-needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: update-swagger-ui-${{ steps.swagger-ui.outputs.latest-version }}
          delete-branch: true
          commit-message: Bump Swagger UI to ${{ steps.swagger-ui.outputs.latest-version }}
          title: Bump Swagger UI to ${{ steps.swagger-ui.outputs.latest-version }}
          body: |
            Updates bundled Swagger UI assets from swagger-api/swagger-ui `${{ steps.swagger-ui.outputs.latest-tag }}`.

            Generated by the scheduled Swagger UI update workflow.

      # PRs created with GITHUB_TOKEN do not trigger the Danger PR workflow.
      - name: Add the pull request to the changelog
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PR_BRANCH: update-swagger-ui-${{ steps.swagger-ui.outputs.latest-version }}
        run: |
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          PR_URL="$(gh pr view "$PR_NUMBER" --json url --jq .url)"
          PR_TITLE="$(gh pr view "$PR_NUMBER" --json title --jq .title)"
          PR_AUTHOR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .user.login)"
          PR_AUTHOR_URL="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .user.html_url)"
          export PR_URL PR_TITLE PR_AUTHOR PR_AUTHOR_URL
          ruby script/update_changelog
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "Update changelog for #${PR_NUMBER}"
          git push origin "$PR_BRANCH"
